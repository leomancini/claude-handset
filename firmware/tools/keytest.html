<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handset Key Test</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 24px 16px; font: 16px/1.4 -apple-system, system-ui, sans-serif; background: #f4f4f5; color: #18181b; }
  @media (prefers-color-scheme: dark) { body { background: #18181b; color: #f4f4f5; } }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 20px; opacity: .7; }
  .keys { display: flex; gap: 16px; flex-wrap: wrap; }
  .key { flex: 1 1 200px; border-radius: 16px; padding: 32px 16px; text-align: center; background: #e4e4e7; transition: background .08s, transform .08s; }
  @media (prefers-color-scheme: dark) { .key { background: #27272a; } }
  .key.down { background: #22c55e; color: #052e16; transform: scale(1.03); }
  .key .name { font-size: 40px; font-weight: 700; }
  .key .label { font-size: 13px; opacity: .7; }
  .key .count { margin-top: 12px; font-variant-numeric: tabular-nums; }
  #log { margin-top: 20px; height: 240px; overflow-y: auto; padding: 12px; border-radius: 8px; background: #fff; font: 13px/1.5 ui-monospace, Menlo, monospace; }
  @media (prefers-color-scheme: dark) { #log { background: #09090b; } }
  #log div:first-child { font-weight: 600; }
</style>
</head>
<body>
<h1>Claude Handset key test</h1>
<p>Keep this window focused and press the side buttons. SW1 should send F17, SW2 should send F18.</p>

<div class="keys">
  <div class="key" id="F17"><div class="name">F17</div><div class="label">SW1 · 1 o'clock</div><div class="count">0 presses</div></div>
  <div class="key" id="F18"><div class="name">F18</div><div class="label">SW2 · 3 o'clock</div><div class="count">0 presses</div></div>
</div>

<div id="log"><div>Waiting for keys…</div></div>

<script>
  const counts = { F17: 0, F18: 0 };
  const log = document.getElementById('log');
  const t0 = performance.now();

  function stamp() { return ((performance.now() - t0) / 1000).toFixed(3) + 's'; }
  function line(text) {
    const d = document.createElement('div');
    d.textContent = stamp() + '  ' + text;
    log.prepend(d);
  }

  window.addEventListener('keydown', (e) => {
    if (e.key === 'F17' || e.key === 'F18') {
      e.preventDefault();
      const el = document.getElementById(e.key);
      if (!e.repeat) {
        counts[e.key]++;
        el.querySelector('.count').textContent = counts[e.key] + ' press' + (counts[e.key] === 1 ? '' : 'es');
        line(e.key + ' down');
      }
      el.classList.add('down');
    } else {
      line('other key: ' + e.key + ' (' + e.code + ')');
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.key === 'F17' || e.key === 'F18') {
      e.preventDefault();
      document.getElementById(e.key).classList.remove('down');
      line(e.key + ' up');
    }
  });
</script>
</body>
</html>
